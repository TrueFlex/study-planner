# CI/CD сайта: проверка HTML и автоматическая публикация на GitHub Pages
name: Deploy static site

on:
  push:
    branches:
      - main
  # pull request в main только проверяется, публикации нет
  pull_request:
    branches:
      - main

# права токена: читать репозиторий и публиковать Pages
permissions:
  contents: read
  pages: write
  id-token: write

# одновременно идет только одна публикация, начатая не прерывается
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # CI: страница должна проходить проверку валидатором HTML
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate HTML
        run: npx --yes html-validate@8 index.html

  # CD: публикация только после успешной проверки и только из main
  deploy:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
